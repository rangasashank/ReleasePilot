name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: releasepilot
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: releasepilot_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U releasepilot -d releasepilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://releasepilot:test-only@localhost:5432/releasepilot_test
      TEST_DATABASE_URL: postgresql+psycopg://releasepilot:test-only@localhost:5432/releasepilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: PYTHONPATH=. uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- ../frontend/openapi.json
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- lib/generated/api.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/configure-local.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down
