[project]
name = "releasepilot-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1",
  "boto3>=1.40,<2",
  "redis>=6,<7",
  "pyjwt[crypto]>=2.10,<3",
  "pgvector>=0.4,<1",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20",
  "mcp>=1.20,<2",
  "openai>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "moto[s3,sqs]>=5.1,<6",
    "cfn-lint>=1,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["boto3", "pgvector.*"]
ignore_missing_imports = true
